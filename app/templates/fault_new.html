{% extends "base.html" %}
{% block title %}登记设备故障{% endblock %}
{% block content %}
<div class="card narrow">
  <h2>登记设备故障</h2>
  <form method="post" action="/faults" class="form">
    <label>故障编号 *
      <input name="code" required placeholder="如 FAULT-2026-0001">
    </label>
    <label>库位 *
      <input name="location" required placeholder="如 冷库A-01">
    </label>
    <label>故障开始时间 *
      <input name="start_at" type="datetime-local" required>
    </label>
    <label>故障结束时间 *
      <input name="end_at" type="datetime-local" required>
    </label>
    <label>故障原因 *
      <input name="reason" required placeholder="如 压缩机故障导致库温升高">
    </label>
    <label>操作者 *
      <input name="operator" required>
    </label>
    <button type="submit" class="btn">提交登记</button>
  </form>
  <p class="hint">
    所有时间段左闭右开；故障结束时间不得晚于提交时刻。登记将按样品登记与已确认交接
    形成的位置时间段找出受影响样品，一次性固定影响清单及各自重叠时段：当前未隔离的
    样品立即隔离、待确认交接失效；已隔离样品仅关联该故障，不重复生成有效隔离。
    相同编号及登记字段重复提交返回原结果；没有受影响样品也会保存空清单。
  </p>
</div>
{% endblock %}
